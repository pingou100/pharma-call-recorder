<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharma Call Recorder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: system-ui; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        .container { 
            max-width: 700px; 
            width: 100%; 
            background: white; 
            border-radius: 16px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.2); 
            display: flex; 
            flex-direction: column; 
            max-height: 90vh; 
            overflow: hidden; 
        }
        
        .header { 
            padding: 30px 30px 0 30px; 
            flex-shrink: 0; 
        }
        h1 { color: #333; font-size: 24px; text-align: center; margin-bottom: 5px; }
        .subtitle { color: #666; font-size: 13px; text-align: center; margin-bottom: 15px; }
        #statusBadge { 
            display: inline-block; 
            padding: 6px 12px; 
            border-radius: 12px; 
            font-size: 11px; 
            font-weight: 600; 
            background: #d1ecf1; 
            color: #0c5460; 
            text-align: center; 
            width: 100%; 
        }
        
        .permission-helper { 
            background: #fff3cd; 
            border-left: 4px solid #ffc107; 
            padding: 12px 15px; 
            margin: 15px 30px; 
            border-radius: 6px; 
            font-size: 12px; 
            display: none; 
            flex-shrink: 0; 
        }
        .permission-helper strong { display: block; margin-bottom: 6px; }
        .permission-link { 
            background: #ffc107; 
            color: #333; 
            padding: 8px 12px; 
            border-radius: 6px; 
            text-decoration: none; 
            font-weight: 600; 
            display: inline-block; 
            margin-top: 6px; 
        }
        
        #conversation { 
            flex: 1; 
            overflow-y: auto; 
            overflow-x: hidden;
            padding: 15px 30px; 
            background: white; 
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        #conversation::-webkit-scrollbar { width: 6px; }
        #conversation::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 3px; }
        #conversation::-webkit-scrollbar-thumb { background: #667eea; border-radius: 3px; }
        #conversation::-webkit-scrollbar-thumb:hover { background: #5568d3; }
        
        .message { 
            margin-bottom: 12px; 
            padding: 10px 14px; 
            border-radius: 10px; 
            max-width: 85%; 
            word-wrap: break-word; 
            font-size: 13px; 
            line-height: 1.4; 
            flex-shrink: 0;
        }
        .message.user { 
            background: #667eea; 
            color: white; 
            margin-left: auto; 
            text-align: right; 
        }
        .message.assistant { 
            background: #f0f0f0; 
            color: #333; 
            margin-right: auto; 
        }
        .message.system { 
            background: #fff3cd; 
            color: #856404; 
            margin: 0 auto; 
            max-width: 100%; 
            text-align: center; 
            font-size: 12px; 
        }
        
        .doctor-card { 
            background: white; 
            border: 2px solid #667eea; 
            border-radius: 12px; 
            padding: 15px; 
            margin: 10px 0; 
            cursor: pointer; 
            transition: all 0.2s; 
            flex-shrink: 0;
        }
        .doctor-card:hover { 
            background: #f8f9ff; 
            transform: translateY(-2px); 
            box-shadow: 0 4px 12px rgba(102,126,234,0.2); 
        }
        .doctor-card h3 { color: #667eea; margin-bottom: 8px; font-size: 15px; }
        .doctor-card p { color: #666; font-size: 12px; margin: 4px 0; }
        
        .speaking-indicator {
            display: none;
            padding: 15px 30px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            flex-shrink: 0;
        }
        .speaking-indicator.active { display: block; }
        
        .input-section { 
            padding: 20px 30px 30px 30px; 
            border-top: 1px solid #eee; 
            background: white; 
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        #transcriptionBox {
            background: #f8f9fa;
            border: 1px dashed #667eea;
            border-radius: 8px;
            padding: 10px;
            min-height: 40px;
            font-size: 12px;
            color: #666;
            font-style: italic;
            display: none;
        }
        #transcriptionBox.active { display: block; }
        
        .dual-input {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        
        #userInput { 
            flex: 1;
            padding: 12px 15px; 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            font-size: 13px; 
            font-family: system-ui;
            resize: vertical;
            min-height: 45px;
            max-height: 120px;
        }
        #userInput:focus { 
            outline: none; 
            border-color: #667eea; 
        }
        
        #sendTextBtn {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        #sendTextBtn:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }
        #sendTextBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        #voiceBtn { 
            width: 100%;
            padding: 15px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 15px; 
            font-weight: 600;
            cursor: pointer; 
            transition: all 0.2s;
            visibility: visible;
            opacity: 1;
            z-index: 10;
        }
        #voiceBtn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 4px 12px rgba(102,126,234,0.4); 
        }
        #voiceBtn:active { 
            transform: scale(0.98); 
        }
        #voiceBtn.recording { 
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 87, 108, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(245, 87, 108, 0); }
        }
        
        #statusText { 
            font-size: 11px; 
            color: #666; 
            text-align: center; 
        }
        
        .settings-row {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }
        
        .auto-play-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #autoPlayToggle {
            width: 40px;
            height: 22px;
            position: relative;
            appearance: none;
            background: #ccc;
            border-radius: 11px;
            cursor: pointer;
            transition: background 0.3s;
        }
        #autoPlayToggle:checked {
            background: #667eea;
        }
        #autoPlayToggle::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
        }
        #autoPlayToggle:checked::before {
            transform: translateX(18px);
        }
        .auto-play-toggle label {
            font-size: 12px;
            color: #666;
            cursor: pointer;
        }
        
        .voice-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .voice-selector label {
            font-size: 12px;
            color: #666;
        }
        #voiceSelect {
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        
        .controls { 
            display: flex; 
            gap: 10px; 
        }
        .btn { 
            flex: 1; 
            padding: 10px; 
            border: none; 
            border-radius: 8px; 
            font-size: 13px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.2s; 
        }
        .btn-secondary { 
            background: #e9ecef; 
            color: #495057; 
        }
        .btn-secondary:hover { 
            background: #dee2e6; 
        }
        .btn-primary { 
            background: #28a745; 
            color: white; 
        }
        .btn-primary:hover { 
            background: #218838; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 Pharma Call Recorder</h1>
            <p class="subtitle">Voice or text-enabled call documentation</p>
            <div id="statusBadge">Ready to record</div>
        </div>

        <div class="permission-helper" id="permissionHelper">
            <strong>⚠️ Microphone access denied</strong>
            Please allow microphone access in Chrome settings to use voice recording.
            <br><a href="chrome://settings/content/microphone" target="_blank" class="permission-link">Open Chrome Settings</a>
        </div>

        <div class="speaking-indicator" id="speakingIndicator">
            🔊 Claude is speaking...
        </div>

        <div id="conversation"></div>

        <div class="input-section">
            <div id="transcriptionBox"></div>
            
            <div class="dual-input">
                <textarea 
                    id="userInput" 
                    placeholder="Type your message here or use voice... (Enter to send, Shift+Enter for new line)"
                    rows="1"
                ></textarea>
                <button id="sendTextBtn">Send ↑</button>
            </div>

            <button id="voiceBtn">🎤 Hold to speak</button>

            <div id="statusText">Click and hold the button to record</div>

            <div class="settings-row">
                <div class="auto-play-toggle">
                    <input type="checkbox" id="autoPlayToggle" checked>
                    <label for="autoPlayToggle">Auto-play responses</label>
                </div>
                
                <div class="voice-selector">
                    <label for="voiceSelect">Voice:</label>
                    <select id="voiceSelect"></select>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-secondary" onclick="clearConversation()">Clear</button>
                <button class="btn btn-primary" onclick="finalizeCall()">Finalize Call</button>
            </div>
        </div>
    </div>

    <script>
        // Relative URL works on both Replit (replit.dev) and localhost
        const API_URL = '';
        
        let conversationHistory = [];
        let selectedDoctorId = null;
        let recognition = null;
        let synthesis = window.speechSynthesis;
        let isRecording = false;
        let isProcessing = false;
        let currentFetchController = null;
        let availableVoices = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Request microphone permission once on page load
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    console.log('Microphone access granted');
                    stream.getTracks().forEach(track => track.stop());
                })
                .catch(err => {
                    console.log('Microphone access denied:', err);
                    document.getElementById('permissionHelper').style.display = 'block';
                });
            
            initSpeechRecognition();
            loadVoices();
            setupEventListeners();
        });

        function setupEventListeners() {
            // Text input - Enter to send, Shift+Enter for newline
            document.getElementById('userInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendTextMessage();
                }
                
                // Cancel processing when user starts typing
                if (isProcessing) {
                    cancelProcessing();
                }
            });

            // Send button
            document.getElementById('sendTextBtn').addEventListener('click', sendTextMessage);

            // Voice button - hold to record
            const voiceBtn = document.getElementById('voiceBtn');
            voiceBtn.addEventListener('mousedown', startRecording);
            voiceBtn.addEventListener('mouseup', stopRecording);
            voiceBtn.addEventListener('mouseleave', stopRecording);
            voiceBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
            voiceBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });
        }

        function loadVoices() {
            availableVoices = synthesis.getVoices();
            if (availableVoices.length === 0) {
                synthesis.addEventListener('voiceschanged', () => {
                    availableVoices = synthesis.getVoices();
                    populateVoiceSelect();
                });
            } else {
                populateVoiceSelect();
            }
        }

        function populateVoiceSelect() {
            const select = document.getElementById('voiceSelect');
            select.innerHTML = '';
            
            // Prefer UK female voice
            let defaultVoice = availableVoices.find(v => v.lang.includes('en-GB') && v.name.toLowerCase().includes('female')) ||
                              availableVoices.find(v => v.lang.includes('en-GB')) ||
                              availableVoices.find(v => v.lang.includes('en-US') && v.name.includes('Google')) ||
                              availableVoices.find(v => v.lang.includes('en-US')) ||
                              availableVoices[0];

            availableVoices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                if (voice === defaultVoice) {
                    option.selected = true;
                }
                select.appendChild(option);
            });
        }

        function initSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window)) {
                updateStatus('Speech recognition not supported in this browser');
                return;
            }

            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-GB';

            recognition.onresult = (event) => {
                const transcript = Array.from(event.results)
                    .map(result => result[0].transcript)
                    .join('');
                
                document.getElementById('transcriptionBox').textContent = transcript;
                document.getElementById('transcriptionBox').classList.add('active');

                if (event.results[0].isFinal) {
                    sendMessage(transcript);
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'not-allowed') {
                    document.getElementById('permissionHelper').style.display = 'block';
                    updateStatus('Microphone access denied');
                } else {
                    updateStatus(`Speech recognition error: ${event.error}`);
                }
                resetRecordingUI();
            };

            recognition.onend = () => {
                if (isRecording) {
                    recognition.start();
                }
            };
        }

        function startRecording() {
            if (isRecording || !recognition) return;
            
            // Cancel any ongoing processing
            if (isProcessing) {
                cancelProcessing();
            }

            isRecording = true;
            document.getElementById('voiceBtn').classList.add('recording');
            document.getElementById('voiceBtn').textContent = '🔴 Recording...';
            updateStatus('Listening...');
            document.getElementById('transcriptionBox').textContent = '';
            document.getElementById('transcriptionBox').classList.add('active');

            recognition.start();
        }

        function stopRecording() {
            if (!isRecording || !recognition) return;
            
            isRecording = false;
            recognition.stop();
            resetRecordingUI();
        }

        function resetRecordingUI() {
            isRecording = false;
            document.getElementById('voiceBtn').classList.remove('recording');
            document.getElementById('voiceBtn').textContent = '🎤 Hold to speak';
            updateStatus('Click and hold the button to record');
        }

        function cancelProcessing() {
            if (currentFetchController) {
                currentFetchController.abort();
                currentFetchController = null;
            }
            if (synthesis.speaking) {
                synthesis.cancel();
            }
            isProcessing = false;
            document.getElementById('speakingIndicator').classList.remove('active');
            updateStatus('Response cancelled - ready for input');
        }

        async function sendTextMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            input.value = '';
            sendMessage(message);
        }

        async function sendMessage(message) {
            addMessage('user', message);
            updateStatus('Processing...');
            document.getElementById('transcriptionBox').classList.remove('active');
            isProcessing = true;

            // Create abort controller
            currentFetchController = new AbortController();

            try {
                const response = await fetch(`${API_URL}/conversation`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        conversation_history: conversationHistory,
                        selected_doctor_id: selectedDoctorId
                    }),
                    signal: currentFetchController.signal
                });

                const data = await response.json();
                conversationHistory = data.conversation_history || conversationHistory;

                if (data.doctors_suggested && data.doctors_suggested.length > 0) {
                    displayDoctorCards(data.doctors_suggested);
                }

                addMessage('assistant', data.assistant_message);

                // Auto-play response if enabled
                if (document.getElementById('autoPlayToggle').checked) {
                    speak(data.assistant_message);
                } else {
                    updateStatus('Response received');
                }

                if (data.is_complete) {
                    updateStatus('Call complete - ready to finalize');
                }

            } catch (error) {
                if (error.name === 'AbortError') {
                    console.log('Request cancelled');
                } else {
                    console.error('Error:', error);
                    addMessage('system', 'Error communicating with server');
                    updateStatus('Error - please try again');
                }
            } finally {
                isProcessing = false;
                currentFetchController = null;
            }
        }

        function speak(text) {
            if (synthesis.speaking) {
                synthesis.cancel();
            }

            const utterance = new SpeechSynthesisUtterance(text);
            const selectedVoiceIndex = document.getElementById('voiceSelect').value;
            utterance.voice = availableVoices[selectedVoiceIndex];
            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            document.getElementById('speakingIndicator').classList.add('active');
            
            utterance.onend = () => {
                document.getElementById('speakingIndicator').classList.remove('active');
                updateStatus('Ready');
            };

            synthesis.speak(utterance);
        }

        function displayDoctorCards(doctors) {
            const conv = document.getElementById('conversation');
            doctors.forEach(doctor => {
                const card = document.createElement('div');
                card.className = 'doctor-card';
                card.innerHTML = `
                    <h3>${doctor.name}</h3>
                    <p><strong>Specialty:</strong> ${doctor.specialty || 'Not specified'}</p>
                    <p><strong>Hospital:</strong> ${doctor.hospital || 'Not specified'}</p>
                    <p><strong>City:</strong> ${doctor.city || 'Not specified'}</p>
                `;
                card.onclick = () => selectDoctor(doctor);
                conv.appendChild(card);
            });
            scrollToBottom();
        }

        function selectDoctor(doctor) {
            selectedDoctorId = doctor.id;
            addMessage('system', `Selected: Dr. ${doctor.name}`);
            sendMessage(`I confirm Dr. ${doctor.name}`);
        }

        function addMessage(role, content) {
            const conv = document.getElementById('conversation');
            const msg = document.createElement('div');
            msg.className = `message ${role}`;
            msg.textContent = content;
            conv.appendChild(msg);
            
            conversationHistory.push({ role, content });
            scrollToBottom();
        }

        function scrollToBottom() {
            const conv = document.getElementById('conversation');
            conv.scrollTop = conv.scrollHeight;
        }

        function updateStatus(text) {
            document.getElementById('statusBadge').textContent = text;
        }

        function clearConversation() {
            if (confirm('Clear conversation history?')) {
                document.getElementById('conversation').innerHTML = '';
                conversationHistory = [];
                selectedDoctorId = null;
                updateStatus('Ready to record');
                if (synthesis.speaking) synthesis.cancel();
            }
        }

        async function finalizeCall() {
            if (conversationHistory.length === 0) {
                alert('No conversation to finalize');
                return;
            }

            if (!confirm('Finalize and save this call record?')) {
                return;
            }

            updateStatus('Finalizing...');

            try {
                const response = await fetch(`${API_URL}/finalize`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        conversation_history: conversationHistory,
                        selected_doctor_id: selectedDoctorId
                    })
                });

                const data = await response.json();
                alert(`Call finalized! Record ID: ${data.record_id}`);
                clearConversation();
                
            } catch (error) {
                console.error('Error:', error);
                alert('Error finalizing call');
            }
        }
    </script>
</body>
</html>
